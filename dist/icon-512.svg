<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5EFE6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C75B39;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A84830;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5653;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F3D3A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="64"/>
  
  <!-- Map Pin -->
  <g transform="translate(256, 200)">
    <!-- Pin body -->
    <path d="M 0,-80 C -44,-80 -80,-44 -80,0 C -80,44 -40,100 0,140 C 40,100 80,44 80,0 C 80,-44 44,-80 0,-80 Z" 
          fill="url(#pinGradient)" 
          stroke="#A84830" 
          stroke-width="4"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="32" fill="#FDF8F3" stroke="#C75B39" stroke-width="3"/>
    
    <!-- Compass needle -->
    <path d="M 0,-20 L 8,0 L 0,20 L -8,0 Z" fill="url(#tealGradient)"/>
    <circle cx="0" cy="0" r="6" fill="#C75B39"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="380" r="8" fill="#1A5653" opacity="0.3"/>
  <circle cx="400" cy="400" r="6" fill="#C75B39" opacity="0.3"/>
  <circle cx="380" cy="120" r="10" fill="#1A5653" opacity="0.2"/>
</svg>
